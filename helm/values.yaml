replicaCount: 1

image:
  repository: nazyvaevdocker/juice-shop
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  port: 3000
  nodePort: 32600

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: juice-shop.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
